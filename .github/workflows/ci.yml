name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros-cpp:
    name: ROS 2 / C++
    runs-on: ubuntu-24.04

    container:
      image: ubuntu:noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install system quality tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            clang-format \
            clang-tidy \
            lcov

      - name: Install ROS dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install \
            --from-paths ros2_ws/src \
            --ignore-src \
            --rosdistro jazzy \
            -r \
            -y

      - name: Check C++ formatting
        shell: bash
        run: ./scripts/check-format.sh

      - name: Build ROS workspace
        shell: bash
        run: ./scripts/build.sh

      - name: Run ROS and C++ tests
        shell: bash
        run: ./scripts/test.sh

      - name: Run clang-tidy
        shell: bash
        run: ./scripts/check-clang-tidy.sh

  python:
    name: Python
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.lock

      - name: Create Python environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            -r app/backend/requirements-dev.lock
          .venv/bin/python -m pip install \
            --no-deps \
            -e app/backend

      - name: Run Python quality gates
        shell: bash
        run: ./scripts/check-python.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Run frontend quality gates
        shell: bash
        run: ./scripts/check-frontend.sh
